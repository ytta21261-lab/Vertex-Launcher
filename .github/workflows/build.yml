name: Build Debug APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # Runner Ubuntu sudah membawa Android SDK (ANDROID_HOME),
      # jadi cukup menerima lisensinya supaya Gradle bisa mengunduh komponen yang kurang.
      - name: Accept Android SDK licenses
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Set up Rust (needed by PetLib)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Install cargo-ndk (needed by PetLib)
        run: cargo install cargo-ndk --locked

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        shell: bash
        env:
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace --console=plain 2>&1 | tee build.log

      # Hanya jalan kalau build gagal: menampilkan ringkasan error di halaman run
      - name: Error summary
        if: failure()
        shell: bash
        run: |
          {
            echo '## Ringkasan error build'
            echo '```'
            grep -n -B3 -A30 "What went wrong" build.log | head -90 || true
            echo '```'
            echo '### Baris yang mengandung error'
            echo '```'
            grep -n -E "^e: |^e: file|error:|Error:|FAILED|Manifest merger|AAPT" build.log | head -40 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "===== ERROR SUMMARY ====="
          grep -n -B3 -A30 "What went wrong" build.log | head -90 || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Vertex-Launcher-debug-apk
          path: "**/build/outputs/apk/**/*.apk"
          if-no-files-found: error
          
